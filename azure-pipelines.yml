# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest #window-latest #macos-latest

steps:
- task: UseNode@1
  inputs:
    version: '24.x'

- script: npm ci
  displayName: 'Installing playwright dependencies'


- script: npx playwright install chromium --with-deps
  displayName: 'Install playwright Chrome Browsers'

- script: npm run test_demo
  displayName: 'Run Tests'


